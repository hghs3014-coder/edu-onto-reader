<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 덕산고 독서와 작문 학습 및 수행평가 대시보드</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: var(--accent-color);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .seq-badge {
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }
        .card-content {
            color: var(--text-color);
            font-size: 0.95rem;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-color);
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #8b949e;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 2026학년도 덕산고등학교 독서와 작문 대시보드</h1>
            <div class="subtitle">교육과정 성취기준 및 수행평가 연계 학습 내용</div>
        </header>

        <div class="grid" id="content-grid">
            <!-- JavaScript로 데이터 렌더링 -->
        </div>

        <footer>
            <p>&copy; 2026 HGHS3014. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // 작성하신 데이터 및 연계 항목 (seq 1 ~ 9)
        const curriculumData = [
            { seq: 1, name: "독서와 작문의 이해", getAct: () => `독서와 작문의 의사소통 방법과 특성을 이해하고 주도적인 독서 생활을 실천함.` },
            { seq: 2, name: "자료 탐색과 선별", getAct: () => `독서 목적과 작문 맥락을 고려하여 가치 있는 글과 자료를 탐색하고 선별함.` },
            { seq: 3, name: "사실적·추론적 읽기", getAct: () => `글에 드러난 정보를 파악하고 드러나지 않은 의미를 추론하며 낯선 어휘를 정리함.` },
            { seq: 4, name: "평가하며 읽기", getAct: () => `글의 내용과 필자의 관점을 평가하고 타당한 근거를 수집하여 설득력 있는 글을 작성함.` },
            { seq: 5, name: "내용 조직 방법과 표현 전략", getAct: () => `다양한 내용 조직 방법과 표현 전략을 찾아 글쓰기에 활용함.` },
            { seq: 6, name: "고쳐 쓰기", getAct: () => `자신의 글을 분석적·비판적 관점으로 읽고 내용과 형식을 효과적으로 고쳐 씀.` },
            { seq: 7, name: "책 대화하기 (수행평가)", getAct: () => `독서 토론 및 대화 과정을 거쳐 핵심 내용을 설명하는 개인 및 모둠 보고서를 완성함.` },
            { seq: 8, name: "수행 평가", getAct: (strat) => `독서 결과물 및 핵심 질문에 대한 응답을 바탕으로 성취기준 도달 여부를 형성평가함.` },
            { seq: 9, name: "파지 및 전이", getAct: (strat) => `배운 개념과 독서전략을 실생활 쟁점 탐구 과제나 새로운 매체 텍스트에 적용함.` }
        ];

        const grid = document.getElementById('content-grid');

        curriculumData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <h3 class="card-title">${item.name}</h3>
                    <span class="seq-badge">Seq. ${item.seq}</span>
                </div>
                <div class="card-content">
                    ${item.getAct()}
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
